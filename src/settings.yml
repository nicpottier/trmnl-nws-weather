---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language:
refresh_interval_floor:
polling_url: "{{ service_url }}?locations={{ locations | url_encode }}&units={{ units }}&bars={{ bars }}&token={{ access_token | url_encode }}"
polling_headers:
polling_body:
id: 519384
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: about
  field_type: author_bio
  name: About
  description: A week of US National Weather Service forecasts for one or more places, each as an hourly temperature line over snow or precipitation bars. Source and setup at <a href="https://github.com/nicpottier/trmnl-nws-weather" class="underline">github.com/nicpottier/trmnl-nws-weather</a>
- keyname: service_url
  field_type: url
  name: Service URL
  description: Your deployed forecast service (a Vercel domain or AWS Lambda Function URL).
  placeholder: https://trmnl-nws-weather.vercel.app/
  default: https://trmnl-nws-weather.vercel.app/
- keyname: access_token
  field_type: password
  name: Access token
  description: Must match the service's ACCESS_TOKEN, if you set one.
  optional: true
- keyname: locations
  field_type: text
  name: Locations
  description: One per line, as <code>Name | latitude,longitude</code>. Up to 4; two fit best on a full screen. NWS covers the US and its territories only.
  default: |-
    Leavenworth, WA | 47.5962,-120.6615
    Stevens Pass, WA | 47.7448,-121.0890
- keyname: units
  field_type: select
  name: Temperature unit
  options:
  - Fahrenheit: us
  - Celsius: si
  default: us
- keyname: bars
  field_type: select
  name: Chart bars
  description: Auto shows snowfall when any is forecast, otherwise liquid precipitation.
  options:
  - Auto: auto
  - Snowfall: snow
  - Precipitation: precip
  default: auto
name: NWS Forecast Chart
description: NWS week chart, multi-location
refresh_interval: 30
